name: Map Asset Relinker Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/map-asset-relinker-desktop.yml"
      - "tools/map_asset_relinker/**"
      - "tools/map_asset_relinker_core/**"
      - "tools/map_asset_relinker_gui/**"
  push:
    branches:
      - "feature/map-asset-relinker-*"
      - "integration/runtime-dev-*"
    tags:
      - "map-asset-relinker-v*"
    paths:
      - ".github/workflows/map-asset-relinker-desktop.yml"
      - "tools/map_asset_relinker/**"
      - "tools/map_asset_relinker_core/**"
      - "tools/map_asset_relinker_gui/**"

permissions:
  contents: read

jobs:
  windows:
    name: Windows GUI executable
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/map_asset_relinker_gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/map_asset_relinker_core/target
            tools/map_asset_relinker_gui/src-tauri/target
          key: map-relinker-windows-${{ runner.os }}-${{ hashFiles('tools/map_asset_relinker_core/Cargo.lock', 'tools/map_asset_relinker_gui/src-tauri/Cargo.lock') }}

      - name: Build Windows desktop bundle
        run: tools/map_asset_relinker_gui/scripts/build_windows.ps1

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: map-asset-relinker-windows
          if-no-files-found: error
          path: |
            tools/map_asset_relinker_gui/dist-windows/portable/**
            tools/map_asset_relinker_core/target/release/map-asset-relinker-core.exe
            tools/map_asset_relinker_gui/src-tauri/target/release/map-asset-relinker-gui.exe
            tools/map_asset_relinker_gui/src-tauri/target/release/bundle/**/*.exe
            tools/map_asset_relinker_gui/src-tauri/target/release/bundle/**/*.msi

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: map-asset-relinker-portable-windows
          if-no-files-found: error
          path: tools/map_asset_relinker_gui/dist-windows/portable/**

      - name: Package portable Windows zip
        run: |
          $PackageDir = "tools/map_asset_relinker_gui/dist-windows/package"
          $ZipPath = Join-Path $PackageDir "map-asset-relinker-windows-portable.zip"
          New-Item -ItemType Directory -Force -Path $PackageDir | Out-Null
          Compress-Archive -Path "tools/map_asset_relinker_gui/dist-windows/portable/*" -DestinationPath $ZipPath -Force

      - name: Upload portable Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: map-asset-relinker-windows-portable-zip
          if-no-files-found: error
          path: tools/map_asset_relinker_gui/dist-windows/package/map-asset-relinker-windows-portable.zip

  publish-release:
    name: Publish Windows zip release asset
    needs: windows
    if: startsWith(github.ref, 'refs/tags/map-asset-relinker-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download portable Windows zip
        uses: actions/download-artifact@v4
        with:
          name: map-asset-relinker-windows-portable-zip
          path: dist

      - name: Publish portable Windows zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          zip_path="dist/map-asset-relinker-windows-portable.zip"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "Map Asset Relinker $TAG_NAME" --notes "Portable Windows build for Map Asset Relinker."
          fi
          gh release upload "$TAG_NAME" "$zip_path" --clobber
